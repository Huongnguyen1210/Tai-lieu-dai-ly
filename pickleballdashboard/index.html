<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Plan — Sân Pickleball</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink:#10231C; --surface:#132922; --surface2:#17332B; --surface3:#1D3D33;
    --line:#2A4A40; --text:#ECEDE7; --text2:#F2E9D8; --muted:#9FB3AB; --muted2:#8FA39B; --dim:#6F8F86;
    --gold:#D9A94A; --platinum:#B9D6D9; --silver:#9AA6AC; --green:#4FB477; --amber:#D9834A; --red:#C1544C;
    --gap-fill:#FFC7CE; --gap-font:#9C0006;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;}
  .display{font-family:'Oswald',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{width:100%;height:100vh;display:flex;overflow:hidden;}

  /* Backdrop */
  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none;}
  #backdrop.show{display:block;}

  /* Sidebar */
  #sidebar{height:100%;display:flex;flex-direction:column;flex-shrink:0;background:var(--surface);
    border-right:1px solid var(--line);z-index:40;transition:width .2s;width:52px;position:relative;}
  #sidebar.expanded{width:78%;max-width:260px;position:fixed;top:0;left:0;bottom:0;box-shadow:4px 0 24px rgba(0,0,0,.35);}
  #sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:12px 10px;border-bottom:1px solid var(--line);}
  #sidebar-title{display:none;}
  #sidebar.expanded #sidebar-title{display:block;}
  #sidebar-title .t1{font-size:13px;font-weight:700;color:var(--text2);letter-spacing:.3px;}
  #sidebar-title .t2{font-size:9.5px;color:var(--dim);}
  #collapse-btn{background:var(--surface3);color:var(--muted2);border:none;border-radius:6px;padding:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  #nav-list{display:flex;flex-direction:column;gap:2px;padding:8px 6px;overflow-y:auto;}
  .nav-label{display:none;font-size:9px;color:var(--dim);letter-spacing:.5px;padding:3px 8px;}
  #sidebar.expanded .nav-label{display:block;}
  .nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;background:transparent;
    border:none;border-left:3px solid transparent;color:var(--muted2);cursor:pointer;text-align:left;}
  .nav-btn.active{background:var(--surface3);border-left:3px solid var(--gold);color:var(--text2);}
  .nav-btn .icon{width:16px;height:16px;flex-shrink:0;}
  .nav-btn .lbl{display:none;font-size:12.5px;font-weight:500;}
  #sidebar.expanded .nav-btn .lbl{display:inline;}
  #scenario-block{display:flex;flex-direction:column;gap:4px;padding:8px 6px;margin-top:auto;border-top:1px solid var(--line);}
  .scenario-pill{width:100%;display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:6px;
    background:transparent;cursor:pointer;font-family:'Oswald',sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.3px;}
  .scenario-dot{width:12px;height:12px;border-radius:999px;flex-shrink:0;}
  #scenario-dots{display:none;flex-direction:column;gap:6px;align-items:center;padding-bottom:8px;}
  #sidebar:not(.expanded) #scenario-dots{display:flex;}
  #sidebar.expanded #scenario-list{display:flex;}
  #scenario-list{display:none;flex-direction:column;gap:4px;padding:0 4px;}
  .dot-btn{width:12px;height:12px;border-radius:999px;background:transparent;cursor:pointer;padding:0;}

  /* Main */
  #main{flex:1;height:100%;overflow-y:auto;min-width:0;}
  #topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px;background:var(--ink);border-bottom:1px solid var(--line);}
  #topbar .left{display:flex;align-items:center;gap:6px;min-width:0;}
  #topbar .title{font-family:'Oswald',sans-serif;font-size:14.5px;font-weight:600;color:var(--text2);letter-spacing:.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #scenario-badge{padding:4px 8px;border-radius:999px;display:flex;align-items:center;gap:6px;flex-shrink:0;}
  #scenario-badge .dot{width:5px;height:5px;border-radius:999px;}
  #scenario-badge span.lbl{font-size:10.5px;font-weight:600;white-space:nowrap;}
  #content{padding:12px;display:flex;flex-direction:column;gap:14px;}

  /* Cards / grid */
  .grid{display:grid;gap:8px;}
  .grid-1{grid-template-columns:1fr;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:1fr 1fr 1fr;}
  .grid-4{grid-template-columns:1fr 1fr;}
  .card{border-radius:8px;padding:12px;background:var(--surface2);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;}
  .card .lbl{font-size:10px;color:var(--muted2);letter-spacing:.2px;}
  .card .val{font-family:'Oswald',sans-serif;font-size:19px;font-weight:600;color:var(--text);line-height:1.15;}
  .card .sub{font-size:10px;color:var(--dim);}

  /* Detail section (accordion) */
  .section{border-radius:8px;overflow:hidden;border:1px solid var(--line);}
  .section-head{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;
    background:var(--surface2);border:none;cursor:pointer;color:var(--text2);}
  .section-head .t{font-family:'Oswald',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.2px;text-align:left;}
  .section-head .chev{transition:transform .2s;color:var(--muted2);flex-shrink:0;}
  .section-head.open .chev{transform:rotate(180deg);}
  .section-body{display:none;padding:12px;background:var(--surface);border-top:1px solid var(--line);}
  .section-body.open{display:block;}

  .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed #24413838;}
  .row .rl{font-size:12px;color:var(--muted);line-height:1.4;}
  .row .rl.bold{color:var(--text);font-weight:600;}
  .row .note{color:var(--dim);font-size:10.5px;}
  .row .rv{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#D8E3DE;flex-shrink:0;text-align:right;}
  .row .rv.bold{color:var(--text2);font-weight:600;}

  .tile{border-radius:6px;padding:10px;background:var(--surface2);margin-bottom:8px;}
  .tile .t{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:2px;}
  .tile .d{font-size:11.5px;color:var(--muted);line-height:1.5;}

  .price-tile{border-radius:8px;padding:8px;background:var(--surface2);}
  .price-tile .lbl{font-family:'Oswald',sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.3px;}
  .price-tile .sub{font-size:9px;color:var(--muted2);margin-bottom:4px;line-height:1.3;}
  .price-tile .val{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--text);font-weight:600;}
  .price-tile .val .u{font-size:9.5px;color:var(--muted2);}

  .occ-box{flex:1;border-radius:4px;padding:6px 8px;text-align:center;background:var(--surface);border:1px solid var(--line);}
  .occ-box .v{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;}
  .occ-box .l{font-size:9.5px;color:var(--dim);}

  .level-tag{padding:2px 8px;border-radius:4px;font-size:10.5px;font-weight:600;color:#12211C;white-space:nowrap;}
  .risk-card{border-radius:6px;padding:10px;background:var(--surface2);border:1px solid var(--line);margin-bottom:8px;}
  .risk-card .head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;}
  .risk-card .head .t{font-size:13px;font-weight:600;color:var(--text2);line-height:1.4;}
  .risk-card .d{font-size:12px;color:var(--muted);line-height:1.55;}

  .opp-card{border-radius:6px;padding:10px;background:var(--surface2);border:1px solid #4FB47755;margin-bottom:8px;}
  .opp-card .head{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .opp-card .head .t{font-size:13px;font-weight:600;color:var(--text2);}
  .opp-card .d{font-size:12px;color:var(--muted);line-height:1.55;}

  .strat-card{border-radius:6px;padding:10px;background:var(--surface2);border:1px solid #D9A94A55;margin-bottom:8px;}
  .strat-card .head{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .strat-card .head .t{font-size:13px;font-weight:600;color:var(--text2);}
  .strat-card .d{font-size:12px;color:var(--muted);line-height:1.55;}

  .pos-card{border-radius:6px;padding:10px;background:var(--surface2);margin-bottom:8px;}
  .pos-card .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .pos-card .name{font-size:12.5px;font-weight:600;}
  .pos-card .price{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
  .pos-card .fit{font-size:11.5px;color:var(--muted);line-height:1.5;}

  .callout{border-radius:6px;padding:10px;margin-top:8px;background:#1D3D3355;border:1px solid #4FB47755;}
  .callout .lead{color:var(--green);font-weight:600;}
  .callout-text{font-size:11.5px;color:var(--muted);line-height:1.5;}

  .italic-note{font-size:10.5px;color:var(--dim);font-style:italic;margin-top:4px;}
  .section-title-block{margin-bottom:6px;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
</style>
</head>

</div>

/* ============================= HELPERS ============================= */
function row(label, value, opts) {
  opts = opts || {};
  const boldL = opts.bold ? " bold" : "";
  const noteHtml = opts.note ? `<span class="note"> — ${esc(opts.note)}</span>` : "";
  const style = opts.accent ? ` style="color:${opts.accent}"` : "";
  return `<div class="row"><span class="rl${boldL}">${esc(label)}${noteHtml}</span><span class="rv${boldL}"${style}>${esc(value)}</span></div>`;
}
function card(label, value, sub, accent) {
  const style = accent ? ` style="color:${accent}"` : "";
  return `<div class="card"><span class="lbl">${esc(label)}</span><span class="val"${style}>${esc(value)}</span>${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</div>`;
}
let sectionCounter = 0;
function section(title, bodyHtml, defaultOpen) {
  sectionCounter++;
  const id = "sec-" + sectionCounter;
  const openCls = defaultOpen ? " open" : "";
  return `<div class="section">
    <button class="section-head${openCls}" data-target="${id}"><span class="t">${esc(title)}</span>
      <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>
    <div class="section-body${openCls}" id="${id}">${bodyHtml}</div>
  </div>`;
}

  html += section("Bối cảnh cạnh tranh & tiếp cận", compBody, true);

  let techBody = TECH_ITEMS.map(t => row(t.name, t.status === "gap" ? t.note : fmtTr(t.value),
    { accent: t.status === "gap" ? "#C1544C" : undefined, note: t.status !== "gap" ? t.note : undefined })).join("");
  html += section("Công nghệ vận hành", techBody);

  let posBody = POS_OPTIONS.map(p => `<div class="pos-card" style="border:1px solid ${p.pick ? "#D9A94A" : "#2A4A40"};">
      <div class="head"><span class="name" style="color:${p.pick ? "#D9A94A" : "#F2E9D8"};">${esc(p.name)}${p.pick ? " — gợi ý ưu tiên" : ""}</span>
      <span class="price">${esc(p.price)}</span></div>
      <div class="fit">${esc(p.fit)}</div></div>`).join("") +
    `<div class="italic-note">Cả 3 đều có tính năng gộp hóa đơn tiền sân + bán nước/phụ kiện, chống thất thoát (phân quyền, lưu vết thao tác), báo cáo bóc tách doanh thu — nên khảo sát demo trước khi chọn.</div>`;
  html += section("Gợi ý phần mềm ghi nhận doanh thu (POS)", posBody, true);

  let gapBody = ADDITIONAL_CAPEX_GAPS.map(g => row(g.name, g.note, { accent: "#C1544C" })).join("");
  html += section("Chi phí & rủi ro hạ tầng bổ sung (mới)", gapBody);

  let coachBody = row("Dạy tập Pickleball", COACHING.note, { accent: "#C1544C" });
  html += section("Dịch vụ dạy tập (mới bổ sung)", coachBody);

  let oppBody = OPPORTUNITIES.map(o => `<div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;">
      <span style="color:#4FB477;margin-top:2px;">✦</span>
      <div><div style="font-size:13px;font-weight:600;color:var(--text2);">${esc(o.title)}</div>
      <div style="font-size:12.5px;color:var(--muted2);line-height:1.5;">${esc(o.detail)}</div></div></div>`).join("");
  html += section("Cơ hội mở rộng", oppBody);

  return html;
}

function renderGiaDinh() {
  let html = "";
  html += `<div class="grid grid-2">${PRICE_TIER.map(t => `
    <div class="price-tile" style="border:1px solid ${t.color}55;">
      <div class="lbl" style="color:${t.color};">${t.label.toUpperCase()}</div>
      <div class="sub">${esc(t.sub)}</div>
      <div class="val">${fmtVnd(t.price)}<span class="u">/h</span></div>
    </div>`).join("")}</div>`;

  let hoursBody = row("Tổng số sân", "19 sân (17 tiêu chuẩn + 2 VIP)") +
    row("Giờ vàng", "17h–22h/23h (~5,5h/ngày)", { note: "giá 320k/h — theo tư vấn Huy" }) +
    row("Giờ thấp điểm", "6h–8h sáng & 15h–17h (4h/ngày)", { note: "giá 200k/h, lấp đầy 20–30% tuỳ mùa" }) +
    row("Khung giờ còn lại (~14,5h/ngày)", "Không tính vào doanh thu", { note: "theo Huy — nhu cầu thực tế không đáng kể", accent: "#6F8F86" }) +
    row("Tổng court-giờ khai thác/tháng", "5.415 giờ", { note: "giảm nhiều so với giả định mở cửa cả ngày trước đây" });
  html += section("Sân bãi & khung giờ", hoursBody, true);

  let occBody = "";
  Object.keys(OCC).forEach(tier => {
    const tInfo = PRICE_TIER.find(p => p.key === tier);
    occBody += `<div style="margin-bottom:8px;"><div style="font-size:12px;font-weight:600;margin-bottom:3px;color:${tInfo.color};">${esc(tInfo.label)}</div>
      <div style="display:flex;gap:8px;">${SCENARIOS.map(s => `
        <div class="occ-box"><div class="v" style="color:${s.color};">${fmtPct(OCC[tier][s.key])}</div><div class="l">${esc(s.label)}</div></div>`).join("")}
      </div></div>`;
  });
  html += section("Tỷ lệ lấp đầy theo kịch bản (occupancy)", occBody);

  let capexBody = CAPEX_ITEMS.map(c => row(c.name, fmtTr(c.value), { note: c.note, accent: c.excluded ? "#6F8F86" : undefined })).join("") +
    row("TỔNG CAPEX CẦN THU HỒI", fmtTr(CAPEX_RECOVER_TOTAL), { bold: true, accent: "#D9A94A" });
  html += section("CAPEX — vốn đầu tư ban đầu", capexBody);

  let fnbBody = row(FNB.water.name, fmtVnd(FNB.water.cost) + " → " + fmtVnd(FNB.water.price), { note: "biên " + fmtPct(FNB.water.margin) }) +
    row(FNB.soda.name, fmtVnd(FNB.soda.cost) + " → " + fmtVnd(FNB.soda.price), { note: "biên " + fmtPct(FNB.soda.margin) }) +
    row("Tỷ trọng doanh thu nước khoáng (giả định)", fmtPct(FNB.mix)) +
    row("Biên lợi nhuận bình quân", fmtPct(FNB.blendedMargin), { bold: true }) +
    row("Tỷ lệ doanh thu nước / doanh thu thuê sân", fmtPct(FNB.ratioToCourtRev), { note: "theo benchmark Huy" });
  html += section("F&B — nước: đơn giá & biên lợi nhuận", fnbBody);

  let parkBody = row("Giá gửi xe máy", fmtVnd(PARKING.priceMotor)) + row("Giá gửi ô tô (3 tiếng)", fmtVnd(PARKING.priceCar)) +
    SCENARIOS.map(s => row(`Lượt/ngày — ${s.label}`, `${PARKING.volumes[s.key].motor} xe máy · ${PARKING.volumes[s.key].car} ô tô`, { accent: s.color })).join("");
  html += section("Giữ xe — đơn giá & lượt xe", parkBody);

  let ballBody = row("Giá thuê xe bóng nhỏ", fmtVnd(BALL.priceSmall)) + row("Giá thuê xe bóng to", fmtVnd(BALL.priceLarge)) +
    row("Giá dịch vụ nhặt bóng", fmtVnd(BALL.pricePick) + "/giờ") +
    SCENARIOS.map(s => row(`Lượt/giờ mỗi ngày — ${s.label}`, `${BALL.volumes[s.key].small} xe nhỏ · ${BALL.volumes[s.key].large} xe to · ${BALL.volumes[s.key].pickHours}h nhặt bóng`, { accent: s.color })).join("");
  html += section("Xe bóng & nhặt bóng — xác nhận lại với Huy", ballBody);

  let benchBody = row("Số sân", BENCHMARK.courts + " sân") + row("Doanh thu thuê sân/tháng", fmtTr(BENCHMARK.courtRev)) +
    row("Giá giờ vàng / thấp điểm", fmtVnd(BENCHMARK.priceGold) + " / " + fmtVnd(BENCHMARK.priceOff)) +
    row("Doanh thu nước/tháng", fmtTr(BENCHMARK.fnbRev)) + row("Chi phí điện nước/tháng", fmtTr(BENCHMARK.util)) +
    row("Chi phí nhân công/tháng", fmtTr(BENCHMARK.labor)) + row("Thuê mặt bằng (2.300m²)/tháng", fmtTr(BENCHMARK.rent)) +
    row("Cam kết hoàn vốn", BENCHMARK.payback, { bold: true });
  html += section("Đối chiếu benchmark — 11 sân Hoàng Quốc Việt (theo Huy)", benchBody);

  return html;
}

function renderDoanhThu(scenario) {
  const r = REVENUE[scenario];
  const s = SCENARIOS.find(x => x.key === scenario);
  let html = `<div class="grid grid-4">
    ${card("TỔNG DOANH THU/THÁNG", fmtTr(r.total), null, s.color)}
    ${card("DOANH THU SÂN", fmtTr(r.court), fmtPct(r.court / r.total) + " tổng DT")}
    ${card("DOANH THU NƯỚC", fmtTr(r.fnb), fmtPct(r.fnb / r.total) + " tổng DT")}
    ${card("DOANH THU PHỤ KHÁC", fmtTr(r.parking + r.ballcart + r.ballpick), "giữ xe + xe bóng + nhặt bóng")}
  </div>`;

  let tierBody = PRICE_TIER.map(t => row(t.label, fmtTr(r[t.key]), { accent: t.color })).join("") +
    row("Tổng doanh thu thuê sân", fmtTr(r.court), { bold: true });
  html += section("Doanh thu thuê sân theo khung giờ", tierBody, true);

  let ancBody = row("Doanh thu nước (= 20% doanh thu sân)", fmtTr(r.fnb)) + row("Doanh thu giữ xe", fmtTr(r.parking)) +
    row("Doanh thu xe bóng (nhỏ + to)", fmtTr(r.ballcart)) + row("Doanh thu nhặt bóng", fmtTr(r.ballpick));
  html += section("Doanh thu phụ trợ", ancBody);

  html += section("Tổng hợp", row("TỔNG DOANH THU/THÁNG", fmtTr(r.total), { bold: true, accent: s.color }));
  return html;
}

function renderChiPhi(scenario) {
  const c = COSTS[scenario];
  const s = SCENARIOS.find(x => x.key === scenario);
  let html = `<div class="grid grid-3">
    ${card("TỔNG CHI PHÍ/THÁNG", fmtTr(c.total), null, s.color)}
    ${card("CHI PHÍ CỐ ĐỊNH", fmtTr(c.subtotal), "không gồm giá vốn nước")}
    ${card("GIÁ VỐN NƯỚC (COGS)", fmtTr(c.cogs))}
  </div>`;

  let fixedBody = row("Thuê đất (BCC, cố định)", fmtTr(c.land)) + row("Điện nước", fmtTr(c.util)) +
    row("Nhân công (gồm HLV do Huy tuyển)", fmtTr(c.labor)) + row("Marketing & bán hàng", fmtTr(c.mkt)) +
    row("Quản lý & vận hành chung", fmtTr(c.admin)) + row("Công nghệ (Alobo + phần mềm POS)", fmtTr(c.tech)) +
    row("Tổng chi phí cố định", fmtTr(c.subtotal), { bold: true });
  html += section("Chi phí cố định", fixedBody, true);

  html += section("Giá vốn hàng bán", row("Giá vốn nước (COGS)", fmtTr(c.cogs), { note: "biên bình quân " + fmtPct(FNB.blendedMargin) }));

  let sumBody = row("TỔNG CHI PHÍ VẬN HÀNH/THÁNG", fmtTr(c.total), { bold: true, accent: s.color }) +
    `<div class="italic-note">Chưa gồm khấu hao CAPEX, thuế TNDN, lãi vay, và chi phí hệ thống bãi đỗ xe (chưa có báo giá).</div>`;
  html += section("Tổng hợp", sumBody);
  return html;
}

function renderPL(scenario) {
  const r = REVENUE[scenario];
  const c = COSTS[scenario];
  const p = PL[scenario];
  const s = SCENARIOS.find(x => x.key === scenario);
  let html = `<div class="grid grid-3">
    ${card("EBITDA / THÁNG", fmtTr(p.ebitda), null, s.color)}
    ${card("BIÊN LỢI NHUẬN", fmtPct(p.margin))}
    ${card("THỜI GIAN HOÀN VỐN", p.ebitda > 0 ? p.payback_m.toFixed(1).replace(".", ",") + " tháng" : "Không hoàn vốn",
      p.ebitda > 0 ? "≈ " + (p.payback_m / 12).toFixed(1).replace(".", ",") + " năm" : "Dòng tiền âm", p.ebitda <= 0 ? "#C1544C" : undefined)}
  </div>`;

  let plBody = row("Tổng doanh thu/tháng", fmtTr(r.total)) + row("Tổng chi phí vận hành/tháng", fmtTr(c.total)) +
    row("LỢI NHUẬN VẬN HÀNH (EBITDA)", fmtTr(p.ebitda), { bold: true, accent: s.color }) +
    row("Biên lợi nhuận vận hành", fmtPct(p.margin));
  html += section("P&L tổng hợp", plBody, true);

  let paybackBody = row("CAPEX cần thu hồi", fmtTr(CAPEX_RECOVER_TOTAL), { note: "không gồm làm sân đã có sẵn" }) +
    row("Thời gian hoàn vốn", p.ebitda > 0 ? p.payback_m.toFixed(2) + " tháng" : "Lỗ dòng tiền", { bold: true }) +
    `<div class="italic-note">Đối chiếu: Huy cam kết hoàn vốn 12–18 tháng. Lưu ý: đây là dòng tiền dự án tạo ra về mặt lý thuyết — vì Bộ Quốc phòng đứng ra thu-chi, thời điểm 3 bên thực nhận nên được thống nhất rõ trong quy chế phối hợp.</div>`;
  html += section("Hoàn vốn", paybackBody);

  let beBody = row("Doanh thu sân cần thiết để hòa vốn", fmtTr(BREAKEVEN.courtRevNeeded)) +
    row("Tỷ lệ lấp đầy bình quân tối thiểu", fmtPct(BREAKEVEN.occupancy), { bold: true, accent: "#D9A94A" }) +
    `<div class="italic-note">Đây là điểm hòa vốn dòng tiền hàng tháng, chưa tính thời gian thu hồi CAPEX.</div>`;
  html += section("Điểm hòa vốn (breakeven) — dựa trên kịch bản Trung bình", beBody);

  return html;
}

function renderRuiRo() {
  const rc = { "Rất cao": 0, "Cao": 0, "Trung bình": 0, "Thấp": 0 };
  RISKS.forEach(r => rc[r.level]++);
  let html = `<div class="grid grid-4">
    ${card("RẤT CAO", rc["Rất cao"], null, LEVEL_COLOR["Rất cao"])}
    ${card("CAO", rc["Cao"], null, LEVEL_COLOR["Cao"])}
    ${card("TRUNG BÌNH", rc["Trung bình"], null, LEVEL_COLOR["Trung bình"])}
    ${card("CƠ HỘI MỞ RỘNG", OPPORTUNITIES.length, null, "#4FB477")}
  </div>`;

  let riskBody = RISKS.map(r => `<div class="risk-card"><div class="head"><span class="t">${esc(r.title)}</span>
      <span class="level-tag" style="background:${LEVEL_COLOR[r.level] || "#6F8F86"};">${r.level.toUpperCase()}</span></div>
      <div class="d">${esc(r.detail)}</div></div>`).join("");
  html += section("Danh sách rủi ro & việc cần làm", riskBody, true);

  let stratBody = COMPETITIVE_STRATEGY.map(c => `<div class="strat-card"><div class="head">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D9A94A" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
      <span class="t">${esc(c.title)}</span></div><div class="d">${esc(c.detail)}</div></div>`).join("");
  html += section("Chiến lược cạnh tranh (gợi ý)", stratBody, true);

  let oppBody = OPPORTUNITIES.map(o => `<div class="opp-card"><div class="head">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4FB477" stroke-width="2"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3z"></path></svg>
      <span class="t">${esc(o.title)}</span></div><div class="d">${esc(o.detail)}</div></div>`).join("");
  html += section("Cơ hội mở rộng", oppBody);

  return html;
}

/* ============================= RENDER MAIN ============================= */
function renderNav() {
  const nav = document.getElementById("nav-list");
  nav.innerHTML = `<div class="nav-label">CỤM NỘI DUNG</div>` + TABS.map(t => `
    <button class="nav-btn ${state.tab === t.key ? "active" : ""}" data-tab="${t.key}">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${ICONS[t.key]}</svg>
      <span class="lbl">${esc(t.label)}</span>
    </button>`).join("");
}

function renderScenarioControls() {
  const list = document.getElementById("scenario-list");
  list.innerHTML = SCENARIOS.map(s => `
    <button class="scenario-pill" data-scenario="${s.key}" style="background:${state.scenario === s.key ? s.color : "transparent"};
      border:1px solid ${state.scenario === s.key ? s.color : "#2A4A40"};color:${state.scenario === s.key ? "#0E211A" : "#B9C7C1"};">
      ${s.label.toUpperCase()}<span class="scenario-dot" style="background:${state.scenario === s.key ? "#0E211A" : s.color};"></span>
    </button>`).join("");
  const dots = document.getElementById("scenario-dots");
  dots.innerHTML = SCENARIOS.map(s => `
    <button class="dot-btn" data-scenario="${s.key}" title="${s.label}"
      style="background:${state.scenario === s.key ? s.color : "transparent"};border:2px solid ${s.color};"></button>`).join("");
}

function renderTopbar() {
  const tabInfo = TABS.find(t => t.key === state.tab);
  document.getElementById("topbar-title").textContent = tabInfo.label;
  document.getElementById("topbar-icon").innerHTML = ICONS[state.tab];
  const needsScenario = ["doanhthu", "chiphi", "pl"].includes(state.tab);
  const badge = document.getElementById("scenario-badge");
  if (needsScenario) {
    const s = SCENARIOS.find(x => x.key === state.scenario);
    badge.style.display = "flex";
    badge.style.background = s.color + "22";
    badge.style.border = "1px solid " + s.color;
    badge.querySelector(".dot").style.background = s.color;
    badge.querySelector(".lbl").style.color = s.color;
    badge.querySelector(".lbl").textContent = s.label;
  } else {
    badge.style.display = "none";
  }
}

function renderContent() {
  const el = document.getElementById("content");
  sectionCounter = 0;
  if (state.tab === "tongquan") el.innerHTML = renderTongQuan();
  else if (state.tab === "giadinh") el.innerHTML = renderGiaDinh();
  else if (state.tab === "doanhthu") el.innerHTML = renderDoanhThu(state.scenario);
  else if (state.tab === "chiphi") el.innerHTML = renderChiPhi(state.scenario);
  else if (state.tab === "pl") el.innerHTML = renderPL(state.scenario);
  else if (state.tab === "ruiro") el.innerHTML = renderRuiRo();
}

function renderSidebar() {
  const sb = document.getElementById("sidebar");
  const bd = document.getElementById("backdrop");
  if (state.expanded) { sb.classList.add("expanded"); bd.classList.add("show"); }
  else { sb.classList.remove("expanded"); bd.classList.remove("show"); }
}

function renderAll() {
  renderNav();
  renderScenarioControls();
  renderTopbar();
  renderContent();
  renderSidebar();
}

/* ============================= EVENTS ============================= */
document.getElementById("collapse-btn").addEventListener("click", () => {
  state.expanded = !state.expanded;
  renderSidebar();
});
document.getElementById("backdrop").addEventListener("click", () => {
  state.expanded = false;
  renderSidebar();
});
document.getElementById("nav-list").addEventListener("click", (e) => {
  const btn = e.target.closest(".nav-btn");
  if (!btn) return;
  state.tab = btn.dataset.tab;
  state.expanded = false;
  renderAll();
});
document.getElementById("scenario-block").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-scenario]");
  if (!btn) return;
  state.scenario = btn.dataset.scenario;
  state.expanded = false;
  renderAll();
});
document.getElementById("content").addEventListener("click", (e) => {
  const head = e.target.closest(".section-head");
  if (!head) return;
  const body = document.getElementById(head.dataset.target);
  head.classList.toggle("open");
  body.classList.toggle("open");
});

/* ============================= INIT ============================= */
renderAll();
</script>
</body>
</html>
