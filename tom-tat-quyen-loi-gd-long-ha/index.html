<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quyền lợi bảo hiểm – Gia đình anh Long &amp; chị Hà</title>
<style>
:root{
  --bg:#f3f5f3;--card:#fff;--ink:#1c2420;--muted:#5d6661;--line:#dde3de;
  --brand:#00a758;--brand-dk:#06874e;--panel:#0f3d2a;--panel-ink:#e9f3ed;--panel-muted:#a6c3b3;
  --good:#0b7a45;--good-bg:#dff3e7;--bad:#b3132a;--bad-bg:#ffdfe3;--na:#9aa49e;--na-bg:#f0f2f0;
  --s1:#00875a;--s2:#2f6fb8;--s3:#c27c0e;
  --panel-w:20vw;--rail:52px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111412;--card:#1a1f1c;--ink:#e6ebe7;--muted:#9aa49e;--line:#2c3430;--panel:#0b2219;
  --good:#8fe0b4;--good-bg:#163826;--bad:#ffb3bc;--bad-bg:#4a1a20;--na:#6f7973;--na-bg:#222825;
  --s1:#1a9d6a;--s2:#4b8ad8;--s3:#c98500;}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}

/* ----- Control panel 20% ----- */
#panel{position:fixed;inset:0 auto 0 0;width:var(--panel-w);min-width:230px;background:var(--panel);color:var(--panel-ink);
  padding:18px 14px;overflow-y:auto;z-index:20;transition:transform .22s ease,box-shadow .22s}
body.autohide #panel{transform:translateX(calc(-100% + var(--rail)))}
body.autohide #panel:hover,body.autohide #panel:focus-within{transform:none;box-shadow:6px 0 24px rgba(0,0,0,.25)}
body.autohide #panel .inner{opacity:0;transition:opacity .15s}
body.autohide #panel:hover .inner,body.autohide #panel:focus-within .inner{opacity:1}
.rail-icon{position:absolute;right:16px;top:18px;font-size:20px;display:none}
body.autohide .rail-icon{display:block}body.autohide #panel:hover .rail-icon{display:none}
.ph{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ph h1{font-size:15px;margin:0;line-height:1.35}.meta{color:var(--panel-muted);font-size:12px;margin:4px 0 6px}
.pin{border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--panel-ink);border-radius:6px;padding:4px 8px;cursor:pointer;font:inherit;font-size:12px;white-space:nowrap}
.gt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--panel-muted);margin:16px 0 6px}
.navbtn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;color:var(--panel-ink);padding:8px 10px;border-radius:6px;cursor:pointer;font:inherit;margin-bottom:2px}
.navbtn:hover{background:rgba(255,255,255,.08)}.navbtn[aria-selected=true]{background:var(--brand);color:#fff;font-weight:600}
.seg{display:flex;background:rgba(255,255,255,.07);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--panel-ink);padding:6px 4px;border-radius:6px;cursor:pointer;font:inherit;font-size:12.5px}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff;font-weight:600}
.tog{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer;margin:4px 0}
.people{display:grid;grid-template-columns:1fr 1fr}
.pbtn{width:100%;margin-top:6px;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,.28);background:transparent;color:var(--panel-ink);cursor:pointer;font:inherit}
.leg{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.leg span{display:flex;gap:8px;align-items:center}
.dot{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:800}
.dot.g{background:var(--good-bg);color:var(--good)}.dot.b{background:var(--bad-bg);color:var(--bad)}.dot.n{background:var(--na-bg);color:var(--na)}

/* ----- Main ----- */
main{margin-left:max(var(--panel-w),230px);padding:18px 28px 40px;transition:margin .22s;max-width:1400px}
body.autohide main{margin-left:var(--rail)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:4px}
.tab{border:0;background:transparent;padding:10px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected=true]{color:var(--brand-dk);border-bottom-color:var(--brand)}
@media (prefers-color-scheme:dark){.tab[aria-selected=true]{color:#5fd39a}}
section[hidden]{display:none}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.lbl::after{content:"";flex:1;height:1px;background:var(--line)}
body.v-sum .detail,body.v-det .summary{display:none}
.summary{margin-bottom:22px}
.lead{font-size:16px;margin:0 0 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.box h3{margin:0 0 12px;font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1100px){.row2{grid-template-columns:1fr}}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.kpi .ic{font-size:26px}.kpi .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)}
@media (max-width:900px){.kpis{grid-template-columns:1fr}}

/* protection grid */
.pg{display:grid;grid-template-columns:minmax(150px,1.3fr) repeat(4,1fr);gap:6px}
.pg .h{font-weight:700;text-align:center;padding:6px 4px;font-size:13px}
.pg .h small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.pg .r{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding:4px}
.cell{border-radius:8px;padding:8px 6px;text-align:center;font-size:12.5px;line-height:1.3;min-height:48px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.cell b{font-size:13px;font-variant-numeric:tabular-nums}
.cell.g{background:var(--good-bg);color:var(--good)}.cell.b{background:var(--bad-bg);color:var(--bad)}.cell.n{background:var(--na-bg);color:var(--na)}
.cell .s{font-size:14px;font-weight:800}

/* stacked premium bar */
.stack{display:flex;height:34px;border-radius:6px;overflow:hidden;gap:2px;background:var(--card)}
.stack div{height:100%;cursor:default}
.stack div:first-child{border-radius:4px 0 0 4px}.stack div:last-child{border-radius:0 4px 4px 0}
.slabels{display:flex;gap:2px;margin-top:8px}
.slabels div{font-size:12.5px;line-height:1.3}.slabels b{display:block;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* bar charts */
.bars svg{width:100%;height:auto;display:block}
.bars text{font:12.5px -apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--ink)}
.bars .muted{fill:var(--muted)}.bars .zero{fill:var(--bad);font-weight:700}
.bars rect.bar{fill:var(--brand-dk)}.bars rect.bar:hover{opacity:.8}
.bars line.grid{stroke:var(--line)}

/* product cards */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;border-top:4px solid var(--brand)}
.pc.off{border-top-color:var(--bad)}
.pc .ic{font-size:24px}.pc h4{margin:4px 0 2px;font-size:15px}.pc .who{font-size:12px;color:var(--muted);margin-bottom:8px}
.pc ul{list-style:none;margin:0;padding:0}.pc li{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0;border-top:1px dashed var(--line)}
.pc li b{font-variant-numeric:tabular-nums;text-align:right}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:10px}
.tag.on{background:var(--good-bg);color:var(--good)}.tag.off{background:var(--bad-bg);color:var(--bad)}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;align-items:stretch}
.step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative;margin-right:26px}
.step:last-child{margin-right:0}
.step:not(:last-child)::after{content:"➜";position:absolute;right:-22px;top:50%;transform:translateY(-50%);color:var(--brand);font-size:18px}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:8px}
.step.p1 .n{background:var(--bad)}
.step h4{margin:0 0 4px;font-size:15px}.step p{margin:0;font-size:13px;color:var(--muted)}
.step .now{font-size:12.5px;margin-top:8px;font-weight:700;color:var(--bad)}
@media (max-width:900px){.steps{grid-template-columns:1fr}.step{margin:0 0 22px}.step:not(:last-child)::after{content:"⬇";right:50%;top:auto;bottom:-24px;transform:none}}

/* detail tables */
details.det{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
details.det>summary{padding:10px 14px;cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details.det>summary::-webkit-details-marker{display:none}
details.det>summary::after{content:"＋";color:var(--muted)}details.det[open]>summary::after{content:"－"}
.wrap{overflow-x:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:560px}
th{background:var(--brand-dk);color:#fff;text-align:left;padding:7px 10px;font-size:13px;font-weight:600}
td{padding:7px 10px;border-top:1px solid var(--line)}td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.zero{background:var(--bad-bg);color:var(--bad);font-weight:700}

body.h-long [data-p=long],body.h-ha [data-p=ha],body.h-minh [data-p=minh],body.h-be [data-p=be]{display:none}
#tip{position:fixed;pointer-events:none;background:#1c2420;color:#fff;padding:6px 9px;border-radius:6px;font-size:12.5px;z-index:50;display:none;max-width:260px}
.foot{color:var(--muted);font-size:12px;margin-top:16px}

@media (max-width:820px){#panel{position:static;width:100%;min-width:0;transform:none!important}#panel .inner{opacity:1!important}
  .rail-icon,.pin{display:none!important}main{margin-left:0!important;padding:14px}}
@media print{#panel,.tabs{display:none}main{margin:0;padding:0}section[hidden]{display:block!important;break-before:page}
  .summary,.detail{display:block!important}details.det>*{display:block}}
</style>
</head>
<body class="v-all">
<div id="tip"></div>

<aside id="panel" aria-label="Bảng điều khiển">
  <span class="rail-icon" aria-hidden="true">☰</span>
  <div class="inner">
    <div class="ph"><div><h1>Quyền lợi bảo hiểm<br>Gia đình anh Long &amp; chị Hà</h1>
      <div class="meta">Cập nhật 17/10/2026</div></div>
      <button class="pin" id="pin">Tự ẩn</button></div>

    <div class="gt">Nội dung</div><nav id="nav"></nav>

    <div class="gt">Chế độ xem</div>
    <div class="seg" id="viewSeg">
      <button data-v="all" aria-pressed="true">Tất cả</button>
      <button data-v="sum" aria-pressed="false">Tóm tắt</button>
      <button data-v="det" aria-pressed="false">Chi tiết</button>
    </div>

    <div class="gt">Thành viên</div>
    <div class="people">
      <label class="tog"><input type="checkbox" data-pp="long" checked> Anh Long</label>
      <label class="tog"><input type="checkbox" data-pp="ha" checked> Chị Hà</label>
      <label class="tog"><input type="checkbox" data-pp="minh" checked> Bé Minh</label>
      <label class="tog"><input type="checkbox" data-pp="be" checked> Bé thứ 2</label>
    </div>

    <div class="gt">Chú thích</div>
    <div class="leg">
      <span><i class="dot g">✓</i> Đang được bảo vệ</span>
      <span><i class="dot b">✕</i> Chưa có / đã hết hiệu lực</span>
      <span><i class="dot n">–</i> Không áp dụng</span>
    </div>
    <button class="pbtn" onclick="window.print()">In / lưu PDF</button>
  </div>
</aside>

<main>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="sections"></div>
  <p class="foot">Đơn vị: VND. Tóm tắt theo tài liệu sản phẩm Manulife; quyền lợi chính xác theo điều khoản hợp đồng.</p>
</main>

<script>
const P={long:"Anh Long",ha:"Chị Hà",minh:"Bé Minh",be:"Bé thứ 2"};
const PP=["long","ha","minh","be"];
const fmt=v=>v.toLocaleString("en-US");
const tr=v=>v>=1e9?(v/1e9).toLocaleString("vi-VN",{maximumFractionDigits:1})+" tỷ":v>=1e6?(v/1e6).toLocaleString("vi-VN",{maximumFractionDigits:1})+" triệu":fmt(v);

/* g = có, b = chưa có, n = không áp dụng */
const grid=[
 {ic:"🛡️",k:"Tử vong",c:[["g","1 tỷ"],["g","1,2 tỷ"],["g","375 triệu"],["b","Chưa có"]]},
 {ic:"🎗️",k:"Bệnh hiểm nghèo",c:[["b","Hết hiệu lực"],["b","Hết hiệu lực"],["g","375 triệu"],["b","Chưa có"]]},
 {ic:"🏥",k:"Nằm viện / năm",c:[["g","500 triệu"],["g","1 tỷ"],["g","500 triệu"],["b","Chưa có"]]},
 {ic:"🩺",k:"Ngoại trú / năm",c:[["g","24 triệu"],["g","24 triệu"],["g","24 triệu"],["b","Chưa có"]]},
 {ic:"🤰",k:"Thai sản",c:[["n","–"],["g","30–50 triệu"],["n","–"],["n","–"]]},
 {ic:"🎓",k:"Quỹ học vấn",c:[["n","–"],["n","–"],["g","375 triệu"],["b","Chưa có"]]},
];
const fees=[["long",24840000,"var(--s1)"],["ha",33790000,"var(--s2)"],["minh",26735000,"var(--s3)"]];
const total=fees.reduce((a,f)=>a+f[1],0);

const pgHTML=`<div class="pg"><div></div>${PP.map(p=>`<div class="h" data-p="${p}">${P[p]}</div>`).join("")}
 ${grid.map(r=>`<div class="r"><span>${r.ic}</span>${r.k}</div>${r.c.map((c,i)=>`<div class="cell ${c[0]}" data-p="${PP[i]}"><span class="s">${c[0]==="g"?"✓":c[0]==="b"?"✕":""}</span><b>${c[1]}</b></div>`).join("")}`).join("")}</div>`;

const stackHTML=`<div class="stack">${fees.map(f=>`<div data-tip="${P[f[0]]}: ${fmt(f[1])} (${Math.round(f[1]/total*100)}%)" style="width:${f[1]/total*100}%;background:${f[2]}"></div>`).join("")}</div>
 <div class="slabels">${fees.map(f=>`<div style="width:${f[1]/total*100}%"><span class="sw" style="background:${f[2]}"></span>${P[f[0]]}<b>${fmt(f[1])}</b></div>`).join("")}</div>`;

function barChart(title,data){ // data: [[p,value]]
  const W=520,rowH=40,left=90,right=110,top=6,H=top+data.length*rowH;
  const max=Math.max(...data.map(d=>d[1]));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">`;
  data.forEach((d,i)=>{const y=top+i*rowH, w=max?(W-left-right)*d[1]/max:0;
    s+=`<g data-p="${d[0]}"><text x="0" y="${y+22}" class="muted">${P[d[0]]}</text>`;
    if(d[1]>0) s+=`<rect class="bar" x="${left}" y="${y+8}" width="${w}" height="20" rx="4" data-tip="${P[d[0]]}: ${fmt(d[1])} đồng"/><text x="${left+w+8}" y="${y+23}">${tr(d[1])}</text>`;
    else s+=`<line x1="${left}" x2="${left}" y1="${y+6}" y2="${y+30}" stroke="var(--bad)" stroke-width="3"/><text x="${left+10}" y="${y+23}" class="zero">0 – chưa có bảo vệ</text>`;
    s+=`</g>`;});
  return `<div class="box bars"><h3>${title}</h3>${s}</svg></div>`;
}

const TABS=[];

/* 1. Tổng quan */
TABS.push({id:"ov",ic:"📊",t:"Tổng quan",html:`
<div class="summary"><div class="lbl">Tóm tắt</div>
 <p class="lead">Cả nhà đã có bảo vệ tử vong và thẻ sức khỏe. <b>Hai điểm còn trống:</b> bố mẹ chưa có bảo vệ bệnh hiểm nghèo, và bé thứ 2 chưa có bảo hiểm.</p>
 <div class="kpis">
  <div class="kpi"><span class="ic">💰</span><div><div class="v">${tr(total)}</div><div class="k">Tổng phí mỗi năm · 3 hợp đồng</div></div></div>
  <div class="kpi bad"><span class="ic">🎗️</span><div><div class="v">0 đồng</div><div class="k">Bảo vệ bệnh hiểm nghèo của bố mẹ</div></div></div>
  <div class="kpi bad"><span class="ic">👶</span><div><div class="v">0 đồng</div><div class="k">Bảo vệ cho bé thứ 2</div></div></div>
 </div>
 <div class="box"><h3>Bức tranh bảo vệ cả nhà</h3>${pgHTML}</div>
</div>
<div class="detail"><div class="lbl">Chi tiết</div>
 <div class="box"><h3>Phí bảo hiểm mỗi năm</h3>${stackHTML}</div>
 <details class="det"><summary>Thông tin hợp đồng</summary><div class="wrap"><table>
  <tr><th>Người được bảo hiểm</th><th>Số hợp đồng</th><th>Hiệu lực</th><th>Phí năm</th></tr>
  <tr data-p="long"><td>Vũ Mạnh Long</td><td>3820462057</td><td>25/04/2022</td><td class="num">24,840,000</td></tr>
  <tr data-p="ha"><td>Nguyễn Minh Hồng Hà</td><td>3820414124</td><td>15/04/2022</td><td class="num">33,790,000</td></tr>
  <tr data-p="minh"><td>Vũ Bảo Minh</td><td>3822629331</td><td>28/05/2022</td><td class="num">26,735,000</td></tr>
  <tr data-p="be"><td>Bé thứ 2</td><td class="zero">Chưa có</td><td>–</td><td class="num zero">0</td></tr>
 </table></div></details>
</div>`});

/* 2. Từng thành viên */
TABS.push({id:"pp",ic:"👨‍👩‍👦",t:"Từng thành viên",html:`
<div class="summary"><div class="lbl">Tóm tắt</div>
 <p class="lead">Bảo vệ tử vong đã có, nhưng nếu bố hoặc mẹ mắc bệnh hiểm nghèo, gia đình <b>không nhận được khoản tiền nào</b>.</p>
 <div class="row2">
  ${barChart("Khi tử vong",[["long",1000000000],["ha",1200000000],["minh",375000000],["be",0]])}
  ${barChart("Khi mắc bệnh hiểm nghèo",[["long",0],["ha",0],["minh",375000000],["be",0]])}
 </div>
</div>
<div class="detail"><div class="lbl">Chi tiết</div>
 <details class="det" open><summary>Quyền lợi theo từng người</summary><div class="wrap"><table>
  <tr><th>Quyền lợi</th>${PP.map(p=>`<th data-p="${p}">${P[p]}</th>`).join("")}</tr>
  ${[["Tử vong do tai nạn",2000000000,2400000000,375000000,0],
     ["Thương tật do tai nạn",1000000000,1200000000,0,0],
     ["Bệnh hiểm nghèo",0,0,375000000,0],
     ["Nằm viện / năm",500000000,1000000000,500000000,0],
     ["Ngoại trú / năm",24000000,24000000,24000000,0],
     ["Học vấn","–","–",375000000,0]]
   .map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map((v,i)=>`<td data-p="${PP[i]}" class="num ${v===0?"zero":""}">${typeof v==="number"?fmt(v):v}</td>`).join("")}</tr>`).join("")}
 </table></div></details>
</div>`});

/* 3. Sản phẩm */
const prods=[
 {ic:"🌱",n:"Món Quà Tương Lai",who:"Anh Long · Chị Hà",on:true,li:[["Tử vong","1 tỷ · 1,2 tỷ"],["Tai nạn","Trả thêm 100%"],["Tích lũy","Quỹ đầu tư, không đảm bảo"]]},
 {ic:"🏥",n:"Sống Khỏe Mỗi Ngày",who:"Anh Long · Chị Hà · Bé Minh",on:true,li:[["Nằm viện/năm","500 tr – 1 tỷ"],["Ngoại trú/năm","24 triệu"],["Thai sản (chị Hà)","30–50 triệu"]]},

/* ---------- dựng giao diện ---------- */
const tabsEl=document.getElementById("tabs"),navEl=document.getElementById("nav"),secEl=document.getElementById("sections");
TABS.forEach((t,i)=>{
 tabsEl.insertAdjacentHTML("beforeend",`<button class="tab" data-t="${t.id}" aria-selected="${i===0}">${t.ic} ${t.t}</button>`);
 navEl.insertAdjacentHTML("beforeend",`<button class="navbtn" data-t="${t.id}" aria-selected="${i===0}"><span>${t.ic}</span>${t.t}</button>`);
 secEl.insertAdjacentHTML("beforeend",`<section id="s-${t.id}" ${i?"hidden":""}>${t.html}</section>`);
});
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function showTab(id){document.querySelectorAll("[data-t]").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===id));
 document.querySelectorAll("main section").forEach(s=>s.hidden=s.id!=="s-"+id);window.scrollTo({top:0});}
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>showTab(b.dataset.t));
const seg=[...document.querySelectorAll("#viewSeg button")];
function setView(v){document.body.classList.remove("v-all","v-sum","v-det");document.body.classList.add("v-"+v);seg.forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));}
seg.forEach(b=>b.onclick=()=>setView(b.dataset.v));
document.querySelectorAll("[data-pp]").forEach(cb=>cb.onchange=()=>document.body.classList.toggle("h-"+cb.dataset.pp,!cb.checked));
const pin=document.getElementById("pin");
function setAuto(on){document.body.classList.toggle("autohide",on);pin.textContent=on?"Ghim":"Tự ẩn";store.set("lhc.auto",on?"1":"0");}
pin.onclick=()=>{setAuto(!document.body.classList.contains("autohide"));pin.blur();};
if(store.get("lhc.auto")==="1")setAuto(true);
document.addEventListener("keydown",e=>{if(e.target.matches("input"))return;if(e.key==="\\")pin.click();const n=+e.key;if(n>=1&&n<=TABS.length)showTab(TABS[n-1].id);});
/* tooltip */
const tip=document.getElementById("tip");
document.addEventListener("mousemove",e=>{const t=e.target.closest("[data-tip]");
 if(t){tip.textContent=t.dataset.tip;tip.style.display="block";tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";}else tip.style.display="none";});
</script>
